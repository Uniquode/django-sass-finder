[project]
name = "django-sass-finder"
version = "3.0.0"
description = "A Django finder that compiles Sass files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Jesus Trujillo", email = "trudev.professional@gmail.com" },
    { name = "David Nugent", email = "davidn@uniquode.io" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0"
]
keywords = [
    "django",
    "scss",
    "staticfiles",
]
dependencies = [
    "Django>=5.2,<7",
]

[project.optional-dependencies]
# legacy compiler backend (SCSS_COMPILER = 'libsass'); Dart Sass is the default
libsass = [
    "libsass>=0.23,<1.0",
]

[project.urls]
Repository = "https://github.com/Uniquode/django_sass_finder"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "libsass>=0.23,<1.0",
]

[tool.django-sass-finder]
# Dart Sass release installed by `python -m django_sass_finder.install`
dart-sass-version = "1.108.1"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "django_sass_finder"
module-root = ""
