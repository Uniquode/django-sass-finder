name: Publish

# Publishes the version in pyproject.toml to PyPI (trusted publishing, no token) and creates
# the matching GitHub release, once the tests have passed for that exact commit on master.
#
#   Test (push to master) passes ──> check ──> build ──> publish ──> release
#
# Each version is released once. Nothing happens unless the version is new: if the tag
# v<version> already exists the run stops after `check`, and nothing is published or released.
# To release, bump `version` in pyproject.toml and merge to master.
#
# There is no retry. If a run fails after `check`, do not re-run it: whatever it managed to
# upload stays where it is, so bump `version` and release again.

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    # the whole Test workflow (every matrix job) succeeded, for a push to this repository's master
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version and check for an existing tag
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # only ever publish the tip of the branch: a newer commit has its own run
          tip=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
          if [ "${tip}" != "${SHA}" ]; then
            echo "::notice::${SHA} is no longer the tip of ${BRANCH}; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # authoritative check against the remote, not the local clone
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "::notice::Tag ${tag} already exists; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distributions
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build package
        run: uv build

      - name: Check the artifacts carry the expected version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2
          for f in dist/*; do
            case "$(basename "$f")" in
              *"-${VERSION}"[-.]*) ;;
              *) echo "::error::${f} does not match version ${VERSION}"; exit 1 ;;
            esac
          done

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # trusted publishing; nothing else needs it
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Publish to PyPI via OIDC trusted publishing
        run: uv publish --trusted-publishing always dist/*

  release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Create tag and release
        run: |
          # this version's section of the changelog, if there is one
          awk -v v="${VERSION}" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found
          ' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          # fails if the tag appeared in the meantime, rather than moving it
          gh release create "${TAG}" dist/* --target "${SHA}" --title "${TAG}" "${notes[@]}"
