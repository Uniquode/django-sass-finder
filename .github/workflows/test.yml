name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Dart Sass
        # the version comes from [tool.django-sass-finder] in pyproject.toml
        run: uv run python -m django_sass_finder.install

      - name: Run tests
        env:
          # a missing compiler backend must fail the build rather than skip its tests
          SCSS_TEST_REQUIRE_ALL: "1"
        run: uv run pytest
